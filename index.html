
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Calculator UI</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  

<h1>Calculator</h1>
<div class="container">
    <div class="display">
    <input type="text" id="input" placeholder="0" readonly>
  </div>

  <div class="buttons">
     <button class="clear" onclick="allClear()" >C</button>
    <button class="del" onclick="backPress()">Del</button>
    <button class="equal" onclick="expression()">=</button>
    <button class="op" onclick="display(this.innerHTML)">/</button>
    <button class="btn" onclick="display(this.innerHTML)">1</button>
    <button class="btn" onclick="display(this.innerHTML)">2</button>
    <button class="btn" onclick="display(this.innerHTML)">3</button>
    <button class="op"  onclick="display(this.innerHTML)">+</button>
    <button class="btn" onclick="display(this.innerHTML)">4</button>
    <button class="btn" onclick="display(this.innerHTML)">5</button>
    <button class="btn" onclick="display(this.innerHTML)">6</button>
    <button class="op" onclick="display(this.innerHTML)">-</button>
    <button class="btn" onclick="display(this.innerHTML)">7</button>
    <button class="btn" onclick="display(this.innerHTML)">8</button>
    <button class="btn" onclick="display(this.innerHTML)">9</button>
    <button class="op" onclick="display(this.innerHTML)">*</button>
    <button class="op" onclick="colon()">()</button>
    <button class="btn zero" onclick="display(this.innerHTML)">0</button>
    <button class="op" onclick="display(this.innerHTML)">%</button>
    
  </div>
</div>
<script src="./script.js"></script>
</body>
</html>
